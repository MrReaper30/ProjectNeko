<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Neko - Select City</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body style="background: #111; color: #fff; font-family: 'Press Start 2P', monospace; text-align: center; padding: 20px;">
  <h1>SELECT CITY REGION</h1>
  <br>
  <div id="city-list" style="display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto;"></div>
  <br><br>
  <a href="index.html" style="color: #00ffcc; text-decoration: none; font-size: 10px;">← MAIN MENU</a>

  <script src="js/state.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("city-list");
      if (container && typeof CITIES !== "undefined") {
        container.innerHTML = CITIES.map((city, index) => {
          var isUnlocked = index <= GAME_STATE.currentCity;
          return '<div style="border: 2px solid ' + (isUnlocked ? '#00ffcc' : '#555') + '; padding: 15px; background: #222;">' +
                   '<h3 style="font-size: 12px; margin-bottom: 8px;">' + city.name + '</h3>' +
                   '<p style="font-size: 8px; margin-bottom: 10px; color: ' + (isUnlocked ? '#fff' : '#888') + ';">' + (isUnlocked ? 'Unlocked' : 'Locked') + '</p>' +
                   (isUnlocked ? '<button style="font-family: \'Press Start 2P\'; font-size: 8px; padding: 6px 12px;" onclick="selectCity(' + index + ')">Deploy</button>' : '') +
                 '</div>';
        }).join("");
      }
    });

    function selectCity(index) {
      GAME_STATE.currentCity = index;
      saveGameState();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

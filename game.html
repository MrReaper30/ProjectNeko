<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Combat - Project Neko</title>
  <link rel="stylesheet" href="style.css?v=1.0.8">
</head>
<body class="game-page">
  <div class="combat-wrapper">
    
    <!-- Top HUD Bar -->
    <header class="hud-top">
      <div class="hud-pill"><span id="level-display">LEVEL 1</span></div>
      <div class="hud-pill"><span id="gold-display">🪙 0</span></div>
      <button class="hud-btn" onclick="togglePause()">⚙️ PAUSE</button>
    </header>

    <div class="enemies-badge">
      ENEMIES LEFT: <span id="enemies-left">6 / 6</span>
    </div>

    <!-- Battle Stage -->
    <main class="battle-stage">
      <!-- Player Unit -->
      <div class="unit-box player-box">
        <div class="health-bar-container">
          <span class="health-label">🐾 <span id="player-hp-text">9 / 9 LIVES</span></span>
          <div class="health-bar-bg"><div id="player-hp-fill" class="hp-fill player-fill"></div></div>
        </div>
        <div id="player-sprite" class="character-sprite cat-hero">
          <div class="cat-eyes"></div>
        </div>
      </div>

      <!-- Enemy Unit -->
      <div class="unit-box enemy-box">
        <div class="health-bar-container">
          <span class="health-label" style="color:#2ed573;">SLIME</span>
          <div class="health-bar-bg"><div id="enemy-hp-fill" class="hp-fill enemy-fill"></div></div>
        </div>
        <div id="enemy-sprite" class="character-sprite slime-enemy"></div>
      </div>
    </main>

    <!-- Upgrades Row -->
    <footer class="upgrades-panel">
      <div class="upgrade-card" onclick="buyDamageBoost()">
        <div class="upgrade-info">
          <strong>Damage Boost <span class="lvl-badge" id="dmg-lvl">Lv.1</span></strong>
          <small id="dmg-stats">ATK: 10</small>
        </div>
        <button class="buy-btn" id="dmg-buy-btn">20 🪙</button>
      </div>

      <div class="upgrade-card" onclick="buySpeedBoost()">
        <div class="upgrade-info">
          <strong>Attack Speed <span class="lvl-badge" id="spd-lvl">Lv.1</span></strong>
          <small id="spd-stats">1000ms</small>
        </div>
        <button class="buy-btn" id="spd-buy-btn">50 🪙</button>
      </div>
    </footer>

    <!-- Pause Modal -->
    <div id="pause-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 class="modal-title">GAME PAUSED</h2>
        <button class="menu-btn btn-play" onclick="togglePause()">RESUME</button>
        <button class="menu-btn btn-close" onclick="window.location.href='cities.html'">QUIT TO STAGES</button>
      </div>
    </div>

  </div>

  <script src="js/state.js?v=1.0.8"></script>
  <script src="js/game.js?v=1.0.8"></script>
  <script>
    function togglePause() {
      const modal = document.getElementById('pause-modal');
      modal.classList.toggle('active');
    }
  </script>
</body>
</html>

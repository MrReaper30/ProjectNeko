<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Neko - Battle Engine</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      max-height: 800px;
      background: url('assets/images/ui/game_backgroud_city_1.jpg') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: rgba(0, 0, 0, 0.6);
    }
    .hud-pill {
      background: #111;
      border: 2px solid #00ffcc;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 8px;
    }
    canvas {
      width: 100%;
      height: 60%;
      display: block;
    }
    .upgrade-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.85);
    }
    .btn-upgrade {
      background: linear-gradient(180deg, #ffd700, #ff8c00);
      border: 2px solid #fff;
      border-radius: 8px;
      padding: 10px;
      color: #000;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud-top">
      <div class="hud-pill" id="city-wave-hud">CITY 1: WAVE 1/5</div>
      <div class="hud-pill" style="color: #ffd700;">🪙 <span id="coin-count">0</span></div>
      <a href="index.html" class="hud-pill" style="color: #ff0055; text-decoration: none;">PAUSE</a>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="upgrade-bar">
      <button class="btn-upgrade" onclick="upgradeDamage()">
        ATK UP<br><br>
        <span id="dmg-cost">20 🪙</span>
      </button>
      <button class="btn-upgrade" onclick="upgradeSpeed()">
        SPEED UP<br><br>
        <span id="speed-cost">50 🪙</span>
      </button>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

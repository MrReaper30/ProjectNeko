<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Neko - Settings</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 20px; background: #111; color: #fff; font-family: 'Press Start 2P', monospace; text-align: center;">
  <div style="background: #222; border: 2px solid #00ffcc; border-radius: 8px; padding: 20px; max-width: 360px; margin: 0 auto;">
    <h1 style="color: #00ffcc; font-size: 16px;">SETTINGS</h1>
    <br>
    <div style="text-align: left; font-size: 8px; display: flex; flex-direction: column; gap: 15px;">
      <label><input type="checkbox" checked> SOUND EFFECTS (SFX)</label>
      <label><input type="checkbox" checked> BACKGROUND MUSIC</label>
      <label><input type="checkbox" checked> COMBAT PARTICLES</label>
    </div>
    <br><br>
    <button onclick="localStorage.clear(); alert('Progress Reset!'); location.reload();" style="font-family: 'Press Start 2P'; font-size: 8px; padding: 8px; background: #ff0055; color: #fff; border: none; width: 100%;">RESET GAME DATA</button>
    <br><br>
    <a href="index.html" style="color: #00ffcc; text-decoration: none; font-size: 8px;">← MAIN MENU</a>
  </div>
</body>
</html>

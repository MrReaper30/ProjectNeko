<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Neko - Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body style="background: #111; color: #fff; font-family: 'Press Start 2P', monospace; text-align: center; padding: 20px;">
  <h1>MEGA SHOP</h1>
  
  <div style="margin: 20px 0; border: 2px solid #555; padding: 10px; background: #222;">
    <span style="margin-right: 15px;">🧶 Yarn: <b id="yarn-count">0</b></span>
    <span>🐟 Sardines: <b id="sardine-count">0</b></span>
  </div>

  <h3>CAT SKINS</h3>
  <div id="skin-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 500px; margin: 0 auto;"></div>

  <br><br>
  <a href="index.html" style="color: #00ffcc; text-decoration: none; font-size: 12px;">← Back to Game</a>

  <script src="js/state.js"></script>
  <script>
    function renderShop() {
      document.getElementById("yarn-count").innerText = GAME_STATE.yarn;
      document.getElementById("sardine-count").innerText = GAME_STATE.sardines;
      
      const grid = document.getElementById("skin-grid");
      if (grid && typeof GAME_ASSETS !== "undefined") {
        grid.innerHTML = GAME_ASSETS.skins.map(function(skin) {
          var isUnlocked = GAME_STATE.unlockedSkins.includes(skin.id);
          var isSelected = GAME_STATE.selectedSkin === skin.id;
          
          return '<div style="border: 2px solid #fff; padding: 10px; background: #222;">' +
                   '<img src="' + skin.sprite + '" alt="' + skin.name + '" width="64" height="64" style="image-rendering: pixelated; display: block; margin: 0 auto 10px;" />' +
                   '<h4 style="font-size: 10px; margin: 5px 0;">' + skin.name + '</h4>' +
                   '<p style="font-size: 8px; margin-bottom: 8px;">' + (skin.cost === 0 ? "Free" : skin.cost + " 🧶") + '</p>' +
                   '<button style="font-family: \'Press Start 2P\', monospace; font-size: 8px; padding: 6px 10px;" onclick="selectSkin(\'' + skin.id + '\', ' + skin.cost + ')">' +
                     (isSelected ? "Equipped" : (isUnlocked ? "Equip" : "Buy")) +
                   '</button>' +
                 '</div>';
        }).join("");
      }
    }

    function selectSkin(id, cost) {
      if (!GAME_STATE.unlockedSkins.includes(id)) {
        if (GAME_STATE.yarn >= cost) {
          GAME_STATE.yarn -= cost;
          GAME_STATE.unlockedSkins.push(id);
          GAME_STATE.selectedSkin = id;
          saveGameState();
          renderShop();
        } else {
          alert("Not enough Yarn!");
        }
      } else {
        GAME_STATE.selectedSkin = id;
        saveGameState();
        renderShop();
      }
    }

    window.addEventListener("DOMContentLoaded", renderShop);
  </script>
</body>
</html>
